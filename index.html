<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Girişi</title>
    <!-- Konfeti Efekti İçin Kütüphane -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Arka Plan Izgarası */
        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }

        /* Müzik Kontrol Butonu */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            color: #fff;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        .music-btn:hover {
            border-color: #ffffff;
            background: rgba(40, 40, 40, 0.9);
        }

        /* Giriş Kutusu */
        .login-card {
            position: relative;
            z-index: 2;
            width: 360px;
            padding: 35px 30px;
            background: rgba(18, 18, 18, 0.9);
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 3px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #fff;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #121212;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .show-pass {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #777;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #dddddd;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <!-- Müzik Butonu -->
    <button class="music-btn" id="musicToggle" onclick="toggleAudio()">🎵 Müziği Başlat</button>

    <!-- Arka Plan Müzik Audio -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Giriş Kartı -->
    <div class="login-card">
        <div class="subtitle">GİRİŞ ALANI</div>
        <div class="title">SİSTEM GİRİŞİ</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <input type="text" placeholder="Kullanıcı Adı" required>
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Şifre" required>
                <span class="show-pass" onclick="togglePassword()">Gör</span>
            </div>
            <button type="submit" class="btn-submit">Giriş Yap</button>
        </form>
    </div>

    <script>
        // Müzik Başlat / Durdur
        const music = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("musicToggle");
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerText = "🎵 Müziği Başlat";
            } else {
                music.play();
                musicBtn.innerText = "⏸️ Müziği Durdur";
            }
            isPlaying = !isPlaying;
        }

        // Şifre Göster / Gizle
        function togglePassword() {
            const passInput = document.getElementById("passwordInput");
            if (passInput.type === "password") {
                passInput.type = "text";
            } else {
                passInput.type = "password";
            }
        }

        // Giriş Yapılınca Kutlama (Konfeti + Müzik Açma)
        function handleLogin(e) {
            e.preventDefault();
            
            // Konfeti Yağmuru
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });

            // Eğer müzik çalmıyorsa giriş yapınca otomatik başlatır
            if (!isPlaying) {
                toggleAudio();
            }
        }
    </script>
</body>
</html>
