<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Girişi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 360px;
            padding: 35px 30px;
            background: rgba(20, 20, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 3px;
            color: #a29bfe;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 15, 25, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 12px rgba(108, 92, 231, 0.5);
        }

        .show-pass {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #a29bfe;
            cursor: pointer;
        }

        .show-pass:hover {
            color: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="subtitle">GİRİŞ ALANI</div>
        <div class="title">SİSTEM GİRİŞİ</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Kullanıcı Adı" required>
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Şifre" required>
                <span class="show-pass" onclick="togglePassword()">Gör</span>
            </div>
            <button type="submit" class="btn-submit">Giriş Yap</button>
        </form>
    </div>

    <script>
        // Şifre Göster / Gizle
        function togglePassword() {
            const passInput = document.getElementById("passwordInput");
            passInput.type = passInput.type === "password" ? "text" : "password";
        }

        // Yerel Giriş İşlemi
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById("usernameInput").value;
            alert(`Hoş geldin, ${username}! Giriş yapıldı.`);
        }
    </script>
</body>
</html>
